name: cider-bot

services:
  napcat:
    image: docker.io/mlikiowa/napcat-docker:latest
    restart: unless-stopped
    environment:
      NAPCAT_UID: ${NAPCAT_UID:-1000}
      NAPCAT_GID: ${NAPCAT_GID:-1000}
    ports:
      - "127.0.0.1:6099:6099"
    volumes:
      - napcat-qq:/app/.config/QQ
      - napcat-config:/app/napcat/config

  cider-bot:
    build:
      context: .
      dockerfile: Containerfile
    image: localhost/cider-bot:dev
    restart: unless-stopped
    depends_on:
      napcat:
        condition: service_started
      postgres:
        condition: service_healthy
        required: false
    environment:
      CIDER_CONFIG_FILE: /etc/cider-bot/config.toml
      CIDER_SECRET_FILE: ${CIDER_SECRET_FILE:-/etc/cider-bot/secret.toml}
      RUST_LOG: ${RUST_LOG:-info}
    volumes:
      - ./config:/etc/cider-bot:ro
      - cider-data:/data
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8080/health/ready"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

  postgres:
    image: docker.io/library/postgres:17
    profiles: ["postgres"]
    restart: unless-stopped
    environment:
      POSTGRES_DB: cider
      POSTGRES_USER: cider
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cider -d cider"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  napcat-qq:
  napcat-config:
  cider-data:
  postgres-data:
