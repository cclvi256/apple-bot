name: "Code Check: Build, Lint and Test"

on:
  workflow_dispatch:
  push:
    branches: ["dev"]
  pull_request:
    branches: ["dev"]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Build
        run: cargo build --verbose
      - name: Run Lint
        run: cargo clippy --verbose -- -D warnings
      - name: Run tests
        run: cargo test --verbose
